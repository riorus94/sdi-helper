name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: sdi-helper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: System deps for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # Mirrors the repo's existing workflows: install via pip (PEP 517 / poetry-core
      # backend) rather than `poetry install`, so a stale poetry.lock does not block CI.
      - name: Install package + test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff mypy

      # Lint and type checks are advisory for now: the repo carries pre-existing
      # ruff/mypy findings (largely missing third-party stubs). They report in CI
      # without blocking; flip continue-on-error off once the debt is cleared.
      - name: Lint (ruff) [advisory]
        continue-on-error: true
        run: ruff check sdi_helper tests

      - name: Type check (mypy)
        run: mypy sdi_helper

      - name: Tests (pytest)
        run: pytest
